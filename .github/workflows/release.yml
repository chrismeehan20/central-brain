name: Release

# Builds the macOS menubar app and attaches it to a GitHub Release.
# Runs on version tags (v0.1.0, v1.2.3, …); workflow_dispatch is for dry runs —
# it builds and uploads artifacts but does not create a release.
#
# The .app is ad-hoc signed only (Tauri's default). Downloaders clear the
# quarantine flag per the README's install instructions. To ship a properly
# signed + notarized build later, add an Apple Developer certificate and fill
# in the commented signing env below — nothing else needs to change.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # npm run build (vite + tsc + server bundle) runs inside menubar:build.
      # The TAURI_SIGNING_* secrets sign the UPDATER artifacts (.app.tar.gz +
      # .sig, verified by the pubkey baked into tauri.conf.json) — this is
      # Tauri's own key, not Apple code signing.
      - run: npm run menubar:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # To also sign and notarize with Apple, provision these repo secrets
        # and uncomment:
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ditto preserves the resource forks/xattrs a plain zip would strip.
      # Space-free artifact names, because gh mangles spaces into dots on upload.
      - name: Package artifacts
        run: |
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --keepParent "Central Brain.app" "Central-Brain-macOS.app.zip"
          mv "Central Brain.app.tar.gz" "Central-Brain-macOS.app.tar.gz"
          mv "Central Brain.app.tar.gz.sig" "Central-Brain-macOS.app.tar.gz.sig"

      # The updater manifest the installed apps poll (tauri.conf.json points at
      # releases/latest/download/latest.json). Version comes from the tag.
      - name: Build latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIGNATURE=$(cat "src-tauri/target/release/bundle/macos/Central-Brain-macOS.app.tar.gz.sig")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node -e '
            const [version, signature, pubDate, tag] = process.argv.slice(1);
            const url = `https://github.com/chrismeehan20/central-brain/releases/download/${tag}/Central-Brain-macOS.app.tar.gz`;
            const manifest = {
              version,
              pub_date: pubDate,
              platforms: { "darwin-aarch64": { signature, url } },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$SIGNATURE" "$PUB_DATE" "$GITHUB_REF_NAME"
          cat latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: central-brain-macos
          path: |
            src-tauri/target/release/bundle/macos/Central-Brain-macOS.app.zip
            src-tauri/target/release/bundle/macos/Central-Brain-macOS.app.tar.gz
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Central Brain ${GITHUB_REF_NAME}" \
            --generate-notes \
            "src-tauri/target/release/bundle/macos/Central-Brain-macOS.app.zip" \
            "src-tauri/target/release/bundle/macos/Central-Brain-macOS.app.tar.gz" \
            latest.json \
            src-tauri/target/release/bundle/dmg/*.dmg
