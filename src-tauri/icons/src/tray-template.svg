<!--
  Menubar (tray) mark: six signals converging on one core.

  Drawn from what the app actually is — many agent sessions across many
  projects, reporting into one place. Deliberately not the stock Tauri logo,
  which shipped as this app's identity until now.

  macOS template image rules: pure black plus alpha, no colour. The system
  inverts it for dark menubars and dims it when the menubar is inactive, which
  is why the full-colour app icon looked wrong up here. Kept to six spokes and
  a fat core because anything finer turns to mush at 22px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <g fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round">
    <path d="M17 11 H20.2" />
    <path d="M14 5.8 L15.6 3.03" />
    <path d="M8 5.8 L6.4 3.03" />
    <path d="M5 11 H1.8" />
    <path d="M8 16.2 L6.4 18.97" />
    <path d="M14 16.2 L15.6 18.97" />
  </g>
  <circle cx="11" cy="11" r="3.2" fill="#000" />
</svg>
