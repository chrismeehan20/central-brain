<!--
  Menubar (tray) mark: three slabs stacked into one solid base.

  Drawn from what the app actually is — many agent sessions across many
  projects, accumulating into one place you check. The base is filled because
  it is the thing you open; the two above it are outlines because they are
  what fed into it.

  Replaces a six-spoke-and-core mark, which was the universal brightness
  glyph: signals radiating *outward* from the centre, the opposite of what
  this app does. This shape has no radial symmetry to be misread.

  macOS template image rules: pure black plus alpha, no colour. The system
  inverts it for dark menubars and dims it when the menubar is inactive, which
  is why a full-colour app icon looks wrong up here.

  Geometry is authored in this 22-unit space and reused verbatim by
  app-icon.svg via a transform, so the two marks cannot drift apart. The gaps
  between slabs are sized against the stroke width (0.9 units of clear air
  after the 1.85 stroke) because anything tighter fills in at 22px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <g fill="none" stroke="#000" stroke-width="1.85" stroke-linejoin="round">
    <rect x="6.2" y="2.5" width="9.6" height="3.4" rx="1.7" />
    <rect x="4.4" y="8.65" width="13.2" height="3.9" rx="1.95" />
  </g>
  <rect x="2.5" y="14.4" width="17" height="5.6" rx="2.4" fill="#000" />
</svg>
