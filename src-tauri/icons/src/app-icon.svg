  <rect width="512" height="512" rx="114" ry="114" fill="#0b0e14" />
  <rect x="8" y="8" width="496" height="496" rx="110" ry="110" fill="none" stroke="#262c3a" stroke-width="6" />
  <g fill="none" stroke="#7dd3fc" stroke-width="30" stroke-linecap="round">
    <path d="M395 256 H455" />
    <path d="M326 137 L356 85" />
    <path d="M186 137 L156 85" />
    <path d="M117 256 H57" />
    <path d="M186 375 L156 427" />
    <path d="M326 375 L356 427" />
  </g>
  <circle cx="256" cy="256" r="74" fill="#7dd3fc" />
</svg>
